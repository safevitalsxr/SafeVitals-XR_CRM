apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: safevitals-backend-netpol
  namespace: safevitals
  labels:
    app.kubernetes.io/name: safevitals-backend
    app.kubernetes.io/component: api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: safevitals-backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress traffic from ingress controller and same namespace
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 4000
  egress:
    # Allow egress to DNS, MongoDB Atlas / external services (HTTPS / MongoDB ports)
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 27017
